version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    # Pi-provided packages must stay pinned to the Pi version actually installed on this
    # machine (see docs/packaging-and-installing.md). Merge those PRs only when the local
    # pi has been updated to the same version.
    groups:
      pi-host-packages:
        patterns:
          - "@earendil-works/*"
          - "typebox"
        update-types:
          - "minor"
          - "patch"
